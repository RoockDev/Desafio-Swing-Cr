<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
</head>
<body>
    <header>
      <a href="/" class="header__logo">
        <img src="./src/assets/img/logo.png" alt="logo-swing-cr">
      </a>

      <!-- boton hamburguesa -->
       <button class="header__menu-toggle">
          ☰
       </button>
      <nav class="header__nav" id="main-nav">
        <ul>
          <li><a href="#horarios">Horarios</a></li>
          <li><a href="#actividades">Actividades</a></li>
          <li><a href="/#mis-actividades.html">Mis actividades</a></li>
        </ul>
      </nav>
      <a href="/inscripcion.html" class="header__cta">Inscribete</a>
    </header>
    <main>
        <h1>Reserva tu plaza</h1>
        <form class="registro-form">
            <div class="form-group">
                <label for="dia-select">Elige el dia:</label>
                <select name="dia" id="dia-select">
                <option value="">--Por favor, elige un dia--</option>
                <option value="viernes">Viernes 10</option>
                <option value="sabado">Sabado 11</option>
                <option value="domingo">Domingo 12</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hora-select">Elige la hora:</label>
                <select name="hora" id="hora-select">
                    <option value="">--Por favor, elige un hora--</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="18" max="100" required>
            </div>

            <button type="submit">Inscribirse</button>

        </form>
        <div id="resultados-actividades"></div>

    </main>
<footer>
        <p>&copy; 2026 Swing Ciudad Real. Todos los derechos reservados.</p>
      </footer>
    
</body>
</html>
