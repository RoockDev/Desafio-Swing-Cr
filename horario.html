<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/assets/css/horario.css" />
    <title>Horario Eventos</title>
  </head>
  <body>
    <main class="contenedor-horario">
      <h1>Horario del Festival</h1>
      <section class="dia-horario" id="viernes">
        <h2>Viernes</h2>
        <div class="grid-horario">
          <div class="columna-horas" id="columna-horas-viernes">
            <div class="horas-espacio-vacio"></div>
            <div id="columna-horas-viernes-dia"></div>
            <div id="columna-horas-viernes-noche"></div>
          </div>
          <div class="columna-sala" id="sala-be-hopper-viernes">
            <h3 class="sala-titulo">Sala Be Hopper</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="sala-new-orleans-viernes">
            <h3 class="sala-titulo">Sala New Orleans</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="sala-savoy-viernes">
            <h3 class="sala-titulo">Sala Savoy</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="casino-viernes">
            <h3 class="sala-titulo">Antiguo Casino</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="gasset-viernes">
            <h3 class="sala-titulo">Parque Gasset</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="prado-viernes">
            <h3 class="sala-titulo">Prado</h3>
            <div class="grid-fondo"></div>
          </div>
        </div>
      </section>
      <section class="dia-horario" id="sabado">
        <h2>Sábado</h2>
        <div class="grid-horario">
          <div class="columna-horas" id="columna-horas-sabado">
            <div class="horas-espacio-vacio"></div>
            <div id="columna-horas-sabado-dia"></div>
            <div id="columna-horas-sabado-noche"></div>
          </div>

          <div class="columna-sala" id="sala-be-hopper-sabado">
            <h3 class="sala-titulo">Sala Be Hopper</h3>
            <div class="grid-fondo"></div>
          </div>

          <div class="columna-sala" id="sala-new-orleans-sabado">
            <h3 class="sala-titulo">Sala New Orleans</h3>
            <div class="grid-fondo"></div>
          </div>

          <div class="columna-sala" id="sala-savoy-sabado">
            <h3 class="sala-titulo">Sala Savoy</h3>
            <div class="grid-fondo"></div>
          </div>

          <div class="columna-sala" id="casino-sabado">
            <h3 class="sala-titulo">Antiguo Casino</h3>
            <div class="grid-fondo"></div>
          </div>

          <div class="columna-sala" id="gasset-sabado">
            <h3 class="sala-titulo">Parque Gasset</h3>
            <div class="grid-fondo"></div>
          </div>

          <div class="columna-sala" id="prado-sabado">
            <h3 class="sala-titulo">Prado</h3>
            <div class="grid-fondo"></div>
          </div>
        </div>
      </section>
      <section class="dia-horario" id="domingo">
        <h2>Domingo</h2>
        <div class="grid-horario">
          <div class="columna-horas" id="columna-horas-domingo">
            <div class="horas-espacio-vacio"></div>
            <div id="columna-horas-domingo-dia"></div>
          </div>
          <div class="columna-sala" id="sala-be-hopper-domingo">
            <h3 class="sala-titulo">Sala Be Hopper</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="sala-new-orleans-domingo">
            <h3 class="sala-titulo">Sala New Orleans</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="sala-savoy-domingo">
            <h3 class="sala-titulo">Sala Savoy</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="casino-domingo">
            <h3 class="sala-titulo">Antiguo Casino</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="gasset-domingo">
            <h3 class="sala-titulo">Parque Gasset</h3>
            <div class="grid-fondo"></div>
          </div>
          <div class="columna-sala" id="prado-domingo">
            <h3 class="sala-titulo">Prado</h3>
            <div class="grid-fondo"></div>
          </div>
        </div>

    <script type="module" src="./src/modules/horario.js"></script>

</html>
